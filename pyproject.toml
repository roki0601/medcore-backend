[project]
name = "medcore-backend"
version = "0.1.0"
description = "MedCore Django backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django",
    "django-cors-headers",
    "djangorestframework",
    "drf-spectacular",
    "gunicorn",
    "psycopg[binary]",
    "python-dotenv",
    "redis",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --strict-config --reuse-db"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
