name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: medcore
      DATABASE_USER: medcore
      DATABASE_PASSWORD: medcore
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_TEST_NAME: medcore_test
      REDIS_URL: redis://127.0.0.1:6379/1

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medcore
          POSTGRES_USER: medcore
          POSTGRES_PASSWORD: medcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medcore -d medcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.9"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run Django checks
        run: uv run python manage.py check

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest --create-db
