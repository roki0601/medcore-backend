# Project-local OMP settings for MedCore backend.
# Grok owns design/planning and implementation. Gemini is reserved for two
# bounded read-only review points: design/spec review and final review after the
# deterministic backend quality gate.
modelRoleStorage: project

modelRoles:
  default: xai-oauth/grok-4.6
  task: xai-oauth/grok-4.6
  commit: xai-oauth/grok-build-0.1

  plan: xai-oauth/grok-4.6
  slow: xai-oauth/grok-4.6
  vision: google-antigravity/gemini-3.8-flash

  architect: xai-oauth/grok-4.6
  senior_review: google-antigravity/gemini-3.8-flash
  advisor: google-antigravity/gemini-3.8-flash
  escalation: google-antigravity/claude-opus-4-6

# No standing advisor loop. Reviewers are spawned explicitly by the manager at
# the bounded workflow gates described in AUTONOMOUS_REVIEW.md.
advisor:
  enabled: false
  syncBacklog: 1

github:
  enabled: true

task:
  isolation:
    enabled: true
    apply: true
    merge: patch
    commits: generic

isolation:
  backend: auto
