# Project-local OMP settings for MedCore.
# Model identifiers are resolved from the existing user catalog; credentials stay global.
# DeepSeek is the primary project model. Thinking level is controlled by each
# agent, so the selector intentionally has no ":max" suffix.
modelRoleStorage: project

modelRoles:
  default: openrouter/deepseek/deepseek-v4.1-flash
  task: openrouter/deepseek/deepseek-v4.1-flash
  commit: openrouter/deepseek/deepseek-v4.1-flash

  plan: openrouter/deepseek/deepseek-v4.1-flash
  slow: openrouter/deepseek/deepseek-v4.1-flash
  vision: openrouter/deepseek/deepseek-v4.1-flash

  architect: openrouter/deepseek/deepseek-v4.1-flash
  senior_review: openrouter/deepseek/deepseek-v4.1-flash
  advisor: openai-codex/gpt-5.6-luna
  escalation: openai-codex/gpt-5.6-luna

# Luna is deliberately not attached to every turn. The manager invokes the
# read-only watchdog explicitly when an escalation trigger is present.
advisor:
  enabled: false
  syncBacklog: 1

github:
  enabled: true

task:
  isolation:
    enabled: true
    apply: true
    merge: patch
    commits: generic

isolation:
  backend: auto
