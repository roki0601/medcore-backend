instructions: |
  Emergency read-only escalation only. Review the supplied compact incident
  packet against accepted decisions/specs and report RESOLVED or BLOCKED.
  Do not review ordinary turns.

advisors:
  - name: MedCore Escalation
    enabled: false
    model: google-antigravity/claude-opus-4-6
    tools: [read, grep, glob]
    instructions: |
      Inspect only the concrete blocker: authoritative-source conflict,
      auth/security/permission issue, destructive migration/data-loss risk,
      transaction/concurrency risk, or repeated deterministic failure after two
      concrete fixes. Stay read-only. Return one RESOLVED recommendation or the
      exact BLOCKED conflict. Do not start a general code review or reviewer
      chain.
