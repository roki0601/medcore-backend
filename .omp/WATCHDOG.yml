instructions: |
  Review MedCore work as a passive, read-only watchdog. Give concrete findings
  with file paths and evidence. Raise a blocker for source-of-truth violations,
  silent TBD decisions, security/auth/paywall boundary violations, destructive
  migration behavior, or failed validation being reported as success.

advisors:
  - name: MedCore Watchdog
    enabled: true
    model: openai-codex/gpt-5.6-luna:high
    tools: [read, grep, glob]
    instructions: |
      Review the current transcript and repository against AGENTS.md,
      PROJECT_STATE.md, accepted medcore-docs decisions, architecture, and the
      project WATCHDOG.md. Stay read-only. Distinguish evidence from assumptions
      and return BLOCKED for unresolved decisions. High risk alone is not a
      human gate when the full quorum and decision-record policy passes.

  - name: Senior Risk Review
    enabled: false
    model: openrouter/deepseek/deepseek-v4.1-flash:max
    tools: [read, grep, glob]
    instructions: |
      Opt-in reviewer for high-risk architecture, security, auth, entitlement,
      transaction, concurrency, migration, and final-review questions. Stay
      read-only and report only evidence-backed findings.
